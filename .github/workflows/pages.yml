name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: code
        run: echo "revision=$(cat code-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: opentac/opentac
          ref: ${{ steps.code.outputs.revision }}
          path: .opentac
      - uses: astral-sh/setup-uv@v6
      - name: Install the website toolchain
        run: uv sync --locked
      - name: Build the website and pinned CAD frontend
        run: uv run python scripts/build_site.py
      - name: Check QR and transfer compatibility
        env:
          OPENTAC_SITE_ROOT: ${{ github.workspace }}
        run: |
          uv sync --project .opentac --locked
          uv run --project .opentac python .opentac/scripts/check_qr_page.py
          uv run --project .opentac python .opentac/scripts/learn/check_transfer.py
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
