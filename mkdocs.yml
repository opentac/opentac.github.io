site_name: OpenTac
site_description: >-
  Open tools to design, fabricate, read and simulate flex-PCB tactile sensors
  that sense normal and shear force, for any robot surface.
site_url: https://opentac.github.io/
repo_url: https://github.com/opentac/opentac
repo_name: opentac/opentac
edit_uri: https://github.com/opentac/opentac.github.io/edit/main/docs/
docs_dir: docs
copyright: "OpenTac. Code MIT, hardware CERN-OHL-P-2.0, docs and media CC BY 4.0."

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/figures/logo.svg
  favicon: assets/figures/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    # Follow the system setting; the toggle cycles auto -> light -> dark.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/opentac.css
extra_javascript:
  - javascripts/opentac.js

extra:
  generator: false
  # The share-card title of the home page (overrides/main.html).
  social_title: OpenTac — Customizable 3D tactile sensing
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/opentac/opentac
      name: OpenTac on GitHub
    - icon: octicons/issue-opened-16
      link: https://github.com/opentac/opentac/issues
      name: Questions and bug reports (GitHub Issues)

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# The QR decoder: a phone opens it from the code on a sensor's back (through
# overrides/404.html), and use/qr-recovery.md links to it. Not a page to browse to.
not_in_nav: |
  /qr.md

# Pages written by other workstreams are listed here before they land; until
# then `mkdocs build` warns that they are missing, and that is expected.
nav:
  - Home: index.md
  - Get started: get-started.md
  - Design:
      - design/index.md
      - Shapes and surfaces: design/shapes.md
      - Design with an AI agent: design/agent.md
      - What the export contains: design/export.md
      - Ready-to-order designs: design/examples.md
  - Build:
      - build/index.md
      - Assembly guide: build/assembly.md
      - Order the sensor: build/order-sensor.md
      - Order the readout board: build/order-readout.md
      - Materials and accessories: build/materials.md
      - Readout boards: hardware.md
  - Use:
      - Flash the firmware: use/flash.md
      - Read a sensor: use/sensor.md
      - Adaptive acquisition (Xampling): use/xampling.md
      - Daisy-chain boards: use/daisy-chain.md
      - Recover a sensor manifest: use/qr-recovery.md
      - Simulate: sim.md
      - Transfer between sensors: transfer.md
  - How it works: learn/index.md
  - Results: results.md
  - Paper: paper.md
  - Reference:
      - Manifest: reference/manifest.md
      - Readout protocol: reference/protocol.md
