<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style>
text { font-family: IBM Plex Sans, Helvetica, Arial, sans-serif; fill: #161c23; font-size: 13px; }
.m { fill: #5b6570; font-size: 12px; } .b { font-weight: 600; }
.s { font-size: 11.5px; } .mid { text-anchor: middle; } .end { text-anchor: end; }
.code { font-family: IBM Plex Mono, Menlo, monospace; font-size: 12px; }
.lead { stroke: #5b6570; stroke-width: 1; fill: none; }
</style>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#161c23"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6570"/></marker></defs>
<rect x="20" y="140" width="90" height="100" rx="6" fill="#eef0f2" stroke="#8a949e"/><text x="65" y="195" class="mid b">computer</text>
<line x1="110" y1="190" x2="160" y2="190" stroke="#161c23" stroke-width="2"/><text x="135" y="182" class="mid s m">USB</text>
<rect x="160" y="130" width="130" height="120" rx="6" fill="#1f5e3a"/><text x="225" y="122" class="mid b">Teensy 4.0</text><text x="225" y="270" class="mid s m">bus controller firmware</text>
<text x="284" y="164" class="end s" style="fill:#fff">VIN</text>
<text x="284" y="184" class="end s" style="fill:#fff">pin 18</text>
<text x="284" y="204" class="end s" style="fill:#fff">pin 19</text>
<text x="284" y="224" class="end s" style="fill:#fff">GND</text>
<text x="345" y="40" class="mid s">3.3 V</text><line x1="318" y1="48" x2="372" y2="48" stroke="#161c23" stroke-width="1.5"/>
<polyline points="330,48 330,58 335,64 325,70 335,76 325,82 335,88 325,94 335,100 325,106 330,112 330,180" fill="none" stroke="#2b46c0" stroke-width="1.4"/><circle cx="330" cy="180" r="2.6" fill="#2b46c0"/>
<polyline points="360,48 360,58 365,64 355,70 365,76 355,82 365,88 355,94 365,100 355,106 360,112 360,200" fill="none" stroke="#2e9e57" stroke-width="1.4"/><circle cx="360" cy="200" r="2.6" fill="#2e9e57"/>
<text x="382" y="76" class="s">pull-up resistors on SDA and SCL,</text><text x="382" y="92" class="s">at the Teensy end only</text>
<line x1="290" y1="160" x2="812" y2="160" stroke="#c0352b" stroke-width="2"/>
<text x="820" y="164" class="s">5 V</text>
<line x1="290" y1="180" x2="812" y2="180" stroke="#2b46c0" stroke-width="2"/>
<text x="820" y="184" class="s">SDA</text>
<line x1="290" y1="200" x2="812" y2="200" stroke="#2e9e57" stroke-width="2"/>
<text x="820" y="204" class="s">SCL</text>
<line x1="290" y1="220" x2="812" y2="220" stroke="#161c23" stroke-width="2"/>
<text x="820" y="224" class="s">GND</text>
<rect x="440" y="142" width="92" height="96" rx="5" fill="#2f5d3a" opacity="0.92"/><text x="486" y="134" class="mid s b">30-pin board</text>
<rect x="446" y="150" width="16" height="80" rx="2" fill="#e8e3d8" stroke="#8a8170"/>
<rect x="510" y="150" width="16" height="80" rx="2" fill="#e8e3d8" stroke="#8a8170"/>
<line x1="486" y1="238" x2="486" y2="270" stroke="#e9b25f" stroke-width="7"/><rect x="456" y="270" width="60" height="44" rx="4" fill="#e9b25f" stroke="#9a6a22"/><text x="486" y="332" class="mid s m">sensor</text>
<rect x="580" y="142" width="92" height="96" rx="5" fill="#2f5d3a" opacity="0.92"/><text x="626" y="134" class="mid s b">30-pin board</text>
<rect x="586" y="150" width="16" height="80" rx="2" fill="#e8e3d8" stroke="#8a8170"/>
<rect x="650" y="150" width="16" height="80" rx="2" fill="#e8e3d8" stroke="#8a8170"/>
<line x1="626" y1="238" x2="626" y2="270" stroke="#e9b25f" stroke-width="7"/><rect x="596" y="270" width="60" height="44" rx="4" fill="#e9b25f" stroke="#9a6a22"/><text x="626" y="332" class="mid s m">sensor</text>
<rect x="720" y="142" width="92" height="96" rx="5" fill="#2f5d3a" opacity="0.92"/><text x="766" y="134" class="mid s b">30-pin board</text>
<rect x="726" y="150" width="16" height="80" rx="2" fill="#e8e3d8" stroke="#8a8170"/>
<rect x="790" y="150" width="16" height="80" rx="2" fill="#e8e3d8" stroke="#8a8170"/>
<line x1="766" y1="238" x2="766" y2="270" stroke="#e9b25f" stroke-width="7"/><rect x="736" y="270" width="60" height="44" rx="4" fill="#e9b25f" stroke="#9a6a22"/><text x="766" y="332" class="mid s m">sensor</text>
<text x="850" y="296" class="mid s m">&#8230; up to</text><text x="850" y="312" class="mid s m">18 boards</text>
<text x="20" y="366" class="s m">Each board has two 4-pin JST-SH bus connectors (light grey), wired the same: the cable comes in on one and goes out on the other.</text>
<text x="20" y="384" class="s m">The bus runs at 1 MHz. SDA and SCL stay at 3.3 V; a board takes 5 V from pin 1 or from its own USB.</text>
</svg>
