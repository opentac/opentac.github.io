<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style>
text { font-family: IBM Plex Sans, Helvetica, Arial, sans-serif; fill: #161c23; font-size: 13px; }
.m { fill: #5b6570; font-size: 12px; } .b { font-weight: 600; }
.s { font-size: 11.5px; } .mid { text-anchor: middle; } .end { text-anchor: end; }
.code { font-family: IBM Plex Mono, Menlo, monospace; font-size: 12px; }
.lead { stroke: #5b6570; stroke-width: 1; fill: none; }
</style>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#161c23"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6570"/></marker></defs>
<rect x="40" y="120" width="560" height="22" fill="#e9b25f" stroke="#9a6a22"/>
<rect x="330" y="80" width="270" height="40" fill="#c98a3a" stroke="#8a5a1a"/>
<rect x="354" y="142" width="246" height="5" fill="#d9a21b"/>
<rect x="54" y="116" width="38" height="4" fill="#d9a21b"/>
<rect x="104" y="116" width="38" height="4" fill="#d9a21b"/>
<rect x="154" y="116" width="38" height="4" fill="#d9a21b"/>
<rect x="204" y="116" width="38" height="4" fill="#d9a21b"/>
<rect x="254" y="116" width="38" height="4" fill="#d9a21b"/>
<text x="40" y="106" class="s m">top: taxels</text>
<text x="40" y="164" class="s m">flex, 0.11 mm</text>
<text x="465.0" y="54" class="mid b">PI stiffener, 0.20 mm</text><text x="465.0" y="71" class="mid s m">on the top (taxel side)</text>
<text x="477.0" y="168" class="mid">contacts on the bottom copper</text><text x="477.0" y="184" class="mid s m">solder mask open only here</text>
<line x1="604" y1="80" x2="632" y2="80" class="lead"/><line x1="604" y1="147" x2="632" y2="147" class="lead"/><line x1="624" y1="80" x2="624" y2="147" stroke="#161c23" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="636" y="112" class="b">0.3 mm</text><text x="636" y="129" class="s m">total at</text><text x="636" y="144" class="s m">the contacts</text>
<line x1="330" y1="194" x2="330" y2="226" class="lead" stroke-dasharray="3 3"/><line x1="600" y1="194" x2="600" y2="226" class="lead" stroke-dasharray="3 3"/><line x1="330" y1="220" x2="600" y2="220" stroke="#161c23" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="465.0" y="213" class="mid s">6 mm</text>
<text x="40" y="224" class="s m">&#8592; to the sensor</text><text x="600" y="250" class="end s m">into the readout board's bottom-contact connector &#8594;</text>
<text x="40" y="278" class="s m">Section along the tail. Thicknesses are drawn far larger than lengths.</text>
</svg>
