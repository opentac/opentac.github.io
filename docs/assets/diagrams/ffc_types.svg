<text x="20" y="236" class="b">Opposite side (B type)</text>
<text x="20" y="254" class="m s">Connectors on opposite faces, or one fold that flips the cable over.</text>
<rect x="20" y="346" width="250" height="14" rx="2" fill="#2f5d3a"/><text x="145" y="382" class="mid s">extension board</text>
