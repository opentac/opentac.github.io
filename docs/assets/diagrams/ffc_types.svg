<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style>
text { font-family: IBM Plex Sans, Helvetica, Arial, sans-serif; fill: #161c23; font-size: 13px; }
.m { fill: #5b6570; font-size: 12px; } .b { font-weight: 600; }
.s { font-size: 11.5px; } .mid { text-anchor: middle; } .end { text-anchor: end; }
.code { font-family: IBM Plex Mono, Menlo, monospace; font-size: 12px; }
