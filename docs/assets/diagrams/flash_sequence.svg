<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<style>
text { font-family: IBM Plex Sans, Helvetica, Arial, sans-serif; fill: #161c23; font-size: 13px; }
.m { fill: #5b6570; font-size: 12px; } .b { font-weight: 600; }
.s { font-size: 11.5px; } .mid { text-anchor: middle; } .end { text-anchor: end; }
.code { font-family: IBM Plex Mono, Menlo, monospace; font-size: 12px; }
.lead { stroke: #5b6570; stroke-width: 1; fill: none; }
</style>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#161c23"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6570"/></marker></defs>
<rect x="30" y="20" width="220" height="44" rx="6" fill="#eef0f2" stroke="#8a949e"/><text x="140" y="47" class="mid b code" style="font-size:13px">uv run opentac flash</text>
<rect x="410" y="20" width="220" height="44" rx="6" fill="#2f5d3a"/><text x="520" y="47" class="mid b" style="fill:#fff">readout board (USB)</text>
<line x1="140" y1="64" x2="140" y2="470" stroke="#c4cad0" stroke-width="2"/>
<rect x="511" y="64" width="18" height="162" fill="#4a8a5c"/><text x="540" y="149.0" class="s m">OpenTac firmware</text>
<rect x="511" y="226" width="18" height="166" fill="#e08a2c"/><text x="540" y="305.0" class="s m">STM32 bootloader</text><text x="540" y="321.0" class="s m">(USB DFU, 0483:df11)</text>
<rect x="511" y="392" width="18" height="78" fill="#4a8a5c"/><text x="540" y="435.0" class="s m">the new firmware</text>
<line x1="140" y1="96" x2="510" y2="96" stroke="#161c23" stroke-width="1.4" marker-end="url(#ah)"/><text x="330.0" y="88" class="mid code">?</text><text x="330.0" y="114" class="mid s m">query board type</text>
<line x1="510" y1="150" x2="140" y2="150" stroke="#161c23" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="330.0" y="142" class="mid code">R,CAPS,…,READOUT60</text>
<line x1="140" y1="196" x2="510" y2="196" stroke="#161c23" stroke-width="1.4" marker-end="url(#ah)"/><text x="330.0" y="188" class="mid code">B</text><text x="330.0" y="214" class="mid s m">enter bootloader (serial port disconnects)</text>
<line x1="140" y1="276" x2="510" y2="276" stroke="#161c23" stroke-width="1.4" marker-end="url(#ah)"/><text x="330.0" y="268" class="mid code">dfu-util … -s 0x08000000:leave -D READOUT60.bin</text><text x="330.0" y="294" class="mid s m">writes firmware/prebuilt/READOUT60.bin from</text>
<text x="330.0" y="310" class="mid s m">the start of flash, only the pages it covers,</text><text x="330.0" y="326" class="mid s m">preserving the stored sensor configuration</text>
<line x1="140" y1="372" x2="510" y2="372" stroke="#161c23" stroke-width="1.4" marker-end="url(#ah)"/><text x="330.0" y="364" class="mid code">leave</text><text x="330.0" y="390" class="mid s m">the board restarts</text>
<text x="20" y="506" class="s b">A new board cannot respond to ? or B until firmware is installed.</text><text x="20" y="524" class="s m">Hold BOOT0 while plugging it in, so it starts in the bootloader, and name the board: opentac flash --board readout60 (or node16).</text>
</svg>
